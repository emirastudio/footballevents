name: Build & deploy

# Builds the production Docker image in CI (NOT on the VPS — the 3.7GB server
# OOMs on `next build`) and pushes it to GHCR. Coolify is configured to deploy
# a prebuilt image and is triggered via its deploy webhook once the push lands.
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
# - COOLIFY_WEBHOOK         — Coolify deploy URL (…/api/v1/deploy?uuid=…&force=true)
# - COOLIFY_TOKEN           — Coolify API token (Bearer)
# - NEXT_PUBLIC_SITE_URL          — e.g. https://footballevents.eu
# - NEXT_PUBLIC_GA_ID             — optional, "" if unused
# - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY — Stripe pk_live_… (client, build-time)
# - NEXT_PUBLIC_PLAUSIBLE_DOMAIN  — optional
# - NEXT_PUBLIC_PLAUSIBLE_SCRIPT  — optional
# - NEXT_PUBLIC_UMAMI_WEBSITE_ID  — optional
# - NEXT_PUBLIC_UMAMI_SCRIPT      — optional
#
# A failed build never pushes an image, so production keeps running the last
# good one — effectively zero-downtime on bad deploys.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_PLAUSIBLE_SCRIPT=${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SCRIPT }}
            NEXT_PUBLIC_UMAMI_WEBSITE_ID=${{ secrets.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
            NEXT_PUBLIC_UMAMI_SCRIPT=${{ secrets.NEXT_PUBLIC_UMAMI_SCRIPT }}

      # Coolify "builds" Dockerfile.deploy (`FROM ghcr.io/<repo>:latest`), which
      # is just an image pull — but `docker build` does NOT re-pull the base
      # image, so Coolify would reuse a stale local :latest. We therefore refresh
      # :latest on the server over SSH first. The SSH key is locked to a forced
      # command (docker pull only) on the server, so it can do nothing else.
      - name: Refresh :latest on server (defeat stale base-image cache)
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          install -m 600 /dev/null deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          ssh -i deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30 \
            "root@${{ secrets.DEPLOY_SSH_HOST }}" true
          rm -f deploy_key

      # Guard: armed only once the GHCR package is pullable by the server.
      # Set repo variable DEPLOY_ENABLED=true to enable.
      - name: Trigger Coolify deploy
        if: vars.DEPLOY_ENABLED == 'true'
        run: |
          curl -fsS -X GET \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ secrets.COOLIFY_WEBHOOK }}"
